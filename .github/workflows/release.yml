name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Stamp the version from the tag
        # The version is baked into the bundle's console banner, so it has to match
        # the tag rather than whatever happens to sit in package.json.
        # `--allow-same-version` keeps this a no-op rather than an error when the
        # release commit already carries the tag's version.
        run: pnpm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"

      - run: pnpm run build

      - name: Attach the bundle to the release
        # HACS downloads `filename` from hacs.json out of the release assets.
        uses: softprops/action-gh-release@v3
        with:
          files: dist/cupertino-widgets.js
          generate_release_notes: true
